<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Invitation</title>
<link rel="stylesheet" href="vendor/fonts.css">
<style>
  :root{
    --sky1:#cfe6ff; --sky2:#ffe6f1;
    --ink:#4b3b5c; --accent:#ff6f9f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#ffe6f1}
  body{font-family:'Quicksand',system-ui,sans-serif;color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased}

  #sky{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 100%)}
  #scene{position:fixed;inset:0;width:100%;height:100%;z-index:1;display:block;pointer-events:none}
  #bar{position:fixed;top:0;left:0;right:0;height:4px;z-index:50;transform-origin:left center;transform:scaleX(0);
       background:linear-gradient(90deg,#ff9ec0,#ffd27f,#9fe3c6,#a9b8ff)}
  main{position:relative;z-index:2}

  section{min-height:100vh;min-height:100svh;display:flex;position:relative}

  /* ---------- Hero ---------- */
  .hero{align-items:center;justify-content:center;text-align:center;padding:0 5vw}
  .hero-inner{max-width:900px}
  .kicker{letter-spacing:.34em;text-transform:uppercase;font-size:clamp(.68rem,1.5vw,.92rem);font-weight:700;color:var(--ink);opacity:.8}
  h1.names{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(2.8rem,9vw,7.6rem);line-height:1.02;margin:.25em 0 .15em;
           text-shadow:0 4px 34px rgba(255,255,255,.95),0 1px 0 rgba(255,255,255,.8)}
  .amp{font-style:italic;font-weight:500;color:var(--accent);padding:0 .1em}
  .sub{font-size:clamp(1rem,2.2vw,1.45rem);font-weight:500;text-shadow:0 2px 16px rgba(255,255,255,.9)}
  .scroll-cue{margin-top:1.6rem;font-size:.85rem;font-weight:600;letter-spacing:.08em;opacity:.75}
  .scroll-cue span{display:inline-block;animation:bounce 1.6s ease-in-out infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

  /* ---------- Story panels ---------- */
  .panel{align-items:center;padding:8vh 6vw}
  .panel.left{justify-content:flex-start}
  .panel.right{justify-content:flex-end}
  .glass{
    background:rgba(255,255,255,.52);
    -webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);
    border:1px solid rgba(255,255,255,.8);
    box-shadow:0 20px 60px rgba(170,110,175,.22),inset 0 1px 0 rgba(255,255,255,.9);
    border-radius:28px;
  }
  .card{width:min(430px,100%);padding:clamp(1.3rem,2.4vw,2.1rem)}
  .chapter{display:block;font-size:.74rem;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .card h2{font-family:'Playfair Display',serif;font-size:clamp(1.55rem,3.1vw,2.3rem);margin:.45rem 0 .65rem;line-height:1.15}
  .card p{line-height:1.65;font-size:clamp(.95rem,1.5vw,1.06rem);font-weight:500}
  .card p.year{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(1.5rem,3vw,2.2rem);
               line-height:1.1;margin-top:.15rem;color:var(--accent);opacity:.92}

  /* ---------- Details ---------- */
  .details{flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:7vh 5vw 5vh}
  .names-sm{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(1.7rem,4vw,3.2rem);line-height:1.1;margin-top:.3rem;
            text-shadow:0 3px 24px rgba(255,255,255,.95)}
  .det-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;width:min(1000px,100%)}
  .det{padding:1.2rem 1.2rem 1.3rem;display:flex;flex-direction:column;gap:.3rem;align-items:center}
  .det .label{font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .det .big{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(1.15rem,2.3vw,1.8rem);line-height:1.2}
  .det .small{font-size:clamp(.85rem,1.3vw,1rem);font-weight:500;opacity:.85;line-height:1.4}

  /* ---------- Portrait / phones ---------- */
  @media (max-aspect-ratio: 9/10){
    .hero{align-items:flex-end;padding-bottom:8vh}
    h1.names{font-size:clamp(2.6rem,13vw,4.6rem)}
    .panel{align-items:flex-end;justify-content:center !important;padding:0 5vw 5vh}
    .card{width:100%;max-width:520px;padding:1.05rem 1.2rem;border-radius:24px}
    .card h2{font-size:1.45rem;margin:.3rem 0 .4rem}
    .card p{font-size:.92rem;line-height:1.5}
    .details{padding:4vh 5vw 4vh}
    .names-sm{font-size:1.6rem}
    .det-grid{grid-template-columns:1fr;gap:.5rem;max-width:520px}
    .det{padding:.6rem 1rem .7rem;border-radius:20px;gap:.1rem}
    .det .big{font-size:1.1rem}
    .det .small{font-size:.82rem}
  }
  @media (max-height:640px) and (min-aspect-ratio: 9/10){
    .card{padding:1rem 1.3rem}.card p{font-size:.9rem;line-height:1.5}
  }
  .no-webgl #scene{display:none}
</style>
</head>
<body>
<div id="sky"></div>
<div id="bar"></div>
<canvas id="scene"></canvas>

<main id="main">
  <!-- HERO -->
  <section class="hero" id="hero">
    <div class="hero-inner">
      <p class="kicker rl">Bersama kedua keluarga</p>
      <h1 class="names rl"><span data-bind="bride"></span> <span class="amp">&amp;</span> <span data-bind="groom"></span></h1>
      <p class="sub rl">akan menikah!</p>
      <p class="scroll-cue rl">Gulir untuk melihat awal ceritanya <span>↓</span></p>
    </div>
  </section>

  <!-- STORY -->
  <section class="panel left">
    <div class="card glass reveal">
      <span class="chapter">Babak Satu</span>
      <h2 data-bind="s1t"></h2>
      <p class="year" data-bind="s1p"></p>
    </div>
  </section>
  <section class="panel right">
    <div class="card glass reveal">
      <span class="chapter">Babak Dua</span>
      <h2 data-bind="s2t"></h2>
      <p class="year" data-bind="s2p"></p>
    </div>
  </section>
  <section class="panel left">
    <div class="card glass reveal">
      <span class="chapter">Babak Tiga</span>
      <h2 data-bind="s3t"></h2>
      <p data-bind="s3p"></p>
    </div>
  </section>
  <section class="panel right">
    <div class="card glass reveal">
      <span class="chapter">Babak Empat</span>
      <h2 data-bind="s4t"></h2>
      <p class="year" data-bind="s4p"></p>
    </div>
  </section>

  <!-- DETAILS -->
  <section class="details" id="details">
    <div class="det-top reveal">
      <p class="kicker">Kami mengundang Anda untuk menghadiri pernikahan</p>
      <h2 class="names-sm"><span data-bind="bride"></span> <span class="amp">&amp;</span> <span data-bind="groom"></span></h2>
    </div>
    <div class="det-grid">
      <div class="det glass reveal">
        <span class="label">Tanggal</span>
        <span class="big" data-bind="dateLong"></span>
        <span class="small" data-bind="dateYear"></span>
      </div>
      <div class="det glass reveal">
        <span class="label">Waktu</span>
        <span class="big" data-bind="time"></span>
        <span class="small" data-bind="timeNote"></span>
      </div>
      <div class="det glass reveal">
        <span class="label">Tempat</span>
        <span class="big" data-bind="venue"></span>
        <span class="small" data-bind="address"></span>
      </div>
    </div>
  </section>
</main>

<script src="vendor/three.min.js"></script>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/ScrollTrigger.min.js"></script>
<script>
(function () {
  'use strict';

  /* =====================================================================
     EDIT YOUR DETAILS HERE
     ===================================================================== */
  const CONFIG = {
    bride: 'Alifa',
    groom: 'Exa',
    dateLong: 'Sabtu, 5 Desember',
    dateYear: '2026',
    time: '08.00 & 11.00 WIB',
    timeNote: 'Akad pukul 08.00 · Resepsi 11.00–14.00',
    venue: 'Dharmein Hotel Jakarta',
    address: 'Jl. Melawai VIII No. 6, Blok M, Kebayoran Baru, Jakarta Selatan',

    s1t: 'Awal Bertemu',
    s1p: '2016',
    s2t: 'Bersama',
    s2p: '2017–2026',
    s3t: 'Cerita Kami',
    s3p: 'Dari pertemuan yang sederhana, percakapan yang terus berlanjut, hingga keyakinan bahwa kami ingin melangkah bersama dalam suka, usaha, dan doa yang sama. Kini dengan ridha Allah dan restu keluarga, kami memutuskan untuk menyatukan langkah dalam ikatan pernikahan.',
    s4t: 'Menikah',
    s4p: '5 Desember 2026'
  };
  /* ===================================================================== */

  document.querySelectorAll('[data-bind]').forEach(function (el) { el.textContent = CONFIG[el.dataset.bind] || ''; });
  document.title = CONFIG.bride + ' & ' + CONFIG.groom + ' \u2014 Undangan Pernikahan';

  gsap.registerPlugin(ScrollTrigger);

  /* ---------------------------------------------------------------------
     DOM animations (text reveals, progress bar)
     --------------------------------------------------------------------- */
  gsap.from('.rl', { y: 30, opacity: 0, duration: 1, stagger: 0.14, delay: 0.3, ease: 'power3.out' });
  gsap.to('.hero-inner', {
    opacity: 0, y: -50, ease: 'none',
    scrollTrigger: { trigger: '#hero', start: 'top top', end: 'bottom 35%', scrub: true }
  });
  gsap.utils.toArray('.reveal').forEach(function (el, i) {
    gsap.from(el, {
      y: 46, opacity: 0, duration: 0.9, ease: 'power3.out',
      scrollTrigger: { trigger: el, start: 'top 90%', toggleActions: 'play none none reverse' }
    });
  });
  gsap.to('#bar', {
    scaleX: 1, ease: 'none',
    scrollTrigger: { trigger: '#main', start: 'top top', end: 'bottom bottom', scrub: true }
  });

  /* ---------------------------------------------------------------------
     THREE.JS SCENE
     --------------------------------------------------------------------- */
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('scene'), antialias: true, alpha: true, powerPreference: 'high-performance' });
  } catch (e) {
    document.body.classList.add('no-webgl');
    return;
  }
  renderer.setClearColor(0x000000, 0);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 120);

  /* ---- lights ---- */
  scene.add(new THREE.HemisphereLight(0xffffff, 0xffd3e6, 0.95));
  var sun = new THREE.DirectionalLight(0xfff0dc, 1.15); sun.position.set(5, 10, 8); scene.add(sun);
  var fill = new THREE.DirectionalLight(0xcfe0ff, 0.45); fill.position.set(-7, 4, 6); scene.add(fill);
  var glow = new THREE.PointLight(0xff9ec8, 0.7, 24); glow.position.set(0, 3, 7); scene.add(glow);

  /* ---- shared state, driven by the GSAP scroll timeline ---- */
  var S = { gap: 1, cx: 0, love: 0, celebrate: 0, join: 0, wave: 1, camDown: 0, zoom: 0, camX: 0, skyT: 0 };
  var L = { ry: 0.5,  hop: 0, tilt: 0, kneel: 0 };   // left figure  = bride
  var R = { ry: -0.5, hop: 0, tilt: 0, kneel: 0 };   // right figure = groom
  var intro = { v: 0 };

  var view = { s: 1, maxX: 6, halfW: 8, portrait: false };
  var DMIN = 1.46;   // half-distance (in figure units) at which the two hands touch

  /* ---- helpers ---- */
  var UNIT = new THREE.SphereGeometry(1, 28, 20);
  function mat(color, o) {
    return new THREE.MeshPhysicalMaterial(Object.assign({ color: color, roughness: 0.42, metalness: 0, clearcoat: 0.55, clearcoatRoughness: 0.3 }, o || {}));
  }
  function ell(parent, material, sx, sy, sz, x, y, z) {
    var m = new THREE.Mesh(UNIT, material);
    m.scale.set(sx, sy, sz); m.position.set(x || 0, y || 0, z || 0);
    parent.add(m); return m;
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

  var shadowTex = (function () {
    var c = document.createElement('canvas'); c.width = c.height = 128;
    var x = c.getContext('2d'); var g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, 'rgba(120,70,130,.45)'); g.addColorStop(1, 'rgba(120,70,130,0)');
    x.fillStyle = g; x.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  })();

  /* =====================================================================
     FUNKO-POP STYLE FIGURE
     ===================================================================== */
  function makeFigure(kind, sign) {
    var bride = kind === 'bride';
    var f = { sign: sign, px: 0, walk: 0, phase: 0, off: bride ? 0 : 1.9, eyes: [], bride: bride };
    var root = new THREE.Group();
    var body = new THREE.Group(); root.add(body);

    var skin = mat(0xffd9c2), white = mat(0xffffff), pink = mat(0xff8fb1);
    var suit = mat(0x31406e), hairM = mat(bride ? 0x8a4a2b : 0x3b2a22, { roughness: 0.35 });
    var shoeM = mat(bride ? 0xffc1d6 : 0x1b1b28), pantsM = bride ? mat(0xffffff) : mat(0x2a375f);
    var eyeM = new THREE.MeshPhysicalMaterial({ color: 0x1a1a28, roughness: 0.12, clearcoat: 1 });
    var blush = new THREE.MeshBasicMaterial({ color: 0xff8fa9, transparent: true, opacity: 0.7, depthWrite: false });
    var mouthM = new THREE.MeshBasicMaterial({ color: 0xc0415f });

    // soft blob shadow
    var sh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
    sh.rotation.x = -Math.PI / 2; sh.position.y = 0.03; sh.scale.set(3.6, 2.6, 1); root.add(sh);

    // legs
    function leg(x) {
      var g = new THREE.Group(); g.position.set(x, 0.78, 0);
      var l = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.5, 16), pantsM); l.position.y = -0.3; g.add(l);
      ell(g, shoeM, 0.27, 0.15, 0.4, 0, -0.6, 0.1);
      body.add(g); return g;
    }
    f.legL = leg(-0.3); f.legR = leg(0.3);

    // torso
    if (bride) {
      var dress = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 1.0, 1.25, 36), white); dress.position.y = 1.07; body.add(dress);
      var hem = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.07, 10, 40), mat(0xffe3ee)); hem.rotation.x = Math.PI / 2; hem.position.y = 0.46; body.add(hem);
      ell(body, white, 0.62, 0.5, 0.46, 0, 1.65, 0);
      var sash = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.065, 10, 36), pink); sash.rotation.x = Math.PI / 2; sash.position.y = 1.45; body.add(sash);
      ell(body, pink, 0.16, 0.11, 0.08, 0, 1.45, 0.62);
    } else {
      ell(body, suit, 0.74, 0.78, 0.52, 0, 1.35, 0);
      ell(body, white, 0.3, 0.48, 0.08, 0, 1.55, 0.45);
      ell(body, mat(0xffffff), 0.04, 0.04, 0.04, 0, 1.38, 0.52);
      ell(body, mat(0xffffff), 0.04, 0.04, 0.04, 0, 1.2, 0.52);
      [-1, 1].forEach(function (sx) {
        var c = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.3, 14), pink);
        c.rotation.z = -sx * Math.PI / 2; c.position.set(sx * 0.17, 1.98, 0.34); body.add(c);
      });
      ell(body, pink, 0.08, 0.08, 0.08, 0, 1.98, 0.36);
      ell(body, pink, 0.08, 0.08, 0.06, 0.36, 1.62, 0.4);
    }

    // arms
    function arm(x) {
      var g = new THREE.Group(); g.position.set(x, 1.75, 0);
      var a = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.13, 0.62, 14), bride ? white : suit); a.position.y = -0.31; g.add(a);
      ell(g, skin, 0.17, 0.17, 0.17, 0, -0.78, 0);
      body.add(g); return g;
    }
    var sx = bride ? 0.7 : 0.85;
    f.armL = arm(-sx); f.armR = arm(sx);
    f.inner = sign > 0 ? f.armR : f.armL;
    f.outer = sign > 0 ? f.armL : f.armR;

    if (bride) {
      // bouquet in the outer hand
      var bq = new THREE.Group(); bq.position.set(0, -0.92, 0.04); f.outer.add(bq);
      var cols = [0xff7fa8, 0xffa8c5, 0xffffff, 0xffd27f, 0xff7fa8, 0xffa8c5];
      var pos = [[0, 0.04, 0], [0.15, 0.0, 0.05], [-0.15, 0.0, 0.05], [0.0, 0.0, 0.17], [0.08, -0.12, 0.1], [-0.08, -0.12, 0.1]];
      pos.forEach(function (p, i) { ell(bq, mat(cols[i]), 0.13, 0.13, 0.13, p[0], p[1], p[2]); });
      var leaf = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.3, 10), mat(0x8fd9a8)); leaf.position.set(0, -0.28, 0.05); leaf.rotation.x = Math.PI; bq.add(leaf);
    } else {
      // ring, revealed while kneeling
      var ring = new THREE.Group(); ring.position.set(0, -0.98, 0.04); ring.visible = false; f.inner.add(ring);
      var gold = mat(0xffd36b, { metalness: 0.9, roughness: 0.2 });
      var band = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.035, 10, 24), gold); ring.add(band);
      var gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.075), new THREE.MeshPhysicalMaterial({ color: 0xbfeaff, emissive: 0x7fd0ff, emissiveIntensity: 0.9, roughness: 0.05, clearcoat: 1 }));
      gem.position.y = 0.17; ring.add(gem);
      f.ring = ring;
    }

    // head
    var head = new THREE.Group(); head.position.y = 2.05; body.add(head);
    ell(head, skin, 1.21, 1.1, 1.1, 0, 1.0, 0);
    var face = new THREE.Group(); face.position.y = 1.0; head.add(face);

    [-1, 1].forEach(function (s) {
      var e = ell(face, eyeM, 0.13, 0.17, 0.07, s * 0.42, 0.02, 1.0); e.userData.sy = 0.17; f.eyes.push(e);
      ell(e, white, 0.35, 0.28, 0.4, 0.3, 0.35, 0.9);
      var c = ell(face, blush, 0.2, 0.12, 0.05, s * 0.74, -0.3, 0.82); c.rotation.y = s * 0.62;
    });
    var mouth = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.032, 8, 20, Math.PI), mouthM);
    mouth.rotation.z = Math.PI; mouth.position.set(0, -0.2, 1.06); face.add(mouth); f.mouth = mouth;

    var cap = new THREE.SphereGeometry(1, 32, 20, 0, Math.PI * 2, 0, bride ? 1.62 : 1.5);
    var hair = new THREE.Mesh(cap, hairM);
    hair.scale.set(bride ? 1.3 : 1.28, bride ? 1.18 : 1.16, bride ? 1.18 : 1.16);
    hair.position.y = 0.03; hair.rotation.x = -0.32; face.add(hair);

    if (bride) {
      ell(face, hairM, 1.15, 1.3, 0.75, 0, -0.35, -0.62);        // long back hair
      [-1, 1].forEach(function (s) {                              // fringe
        var b = ell(face, hairM, 0.5, 0.3, 0.32, s * 0.5, 0.66, 0.74); b.rotation.z = s * -0.4;
      });
      ell(face, hairM, 0.38, 0.38, 0.38, 0, 1.2, -0.15);          // bun
      for (var i = 0; i < 7; i++) {                               // flower crown
        var a = -1.3 + i * (2.6 / 6);
        var fl = ell(face, mat(i % 2 ? 0xff9ec0 : 0xffffff), 0.12, 0.12, 0.12, Math.sin(a) * 0.98, 0.8, Math.cos(a) * 0.8 - 0.05);
        ell(fl, mat(0xffd27f), 0.4, 0.4, 0.4, 0, 0, 0.7);
      }
      var veil = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 20, 0, Math.PI * 2, 0, 1.6),
        new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.3, roughness: 0.4, side: THREE.DoubleSide, depthWrite: false }));
      veil.scale.set(1.42, 1.32, 1.32); veil.rotation.x = -0.55; face.add(veil);
      [-1, 1].forEach(function (s) {                              // lashes
        var l = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.025, 0.02), eyeM);
        l.position.set(s * 0.58, 0.14, 0.97); l.rotation.z = s * 0.5; face.add(l);
      });
    } else {
      ell(face, hairM, 0.55, 0.4, 0.5, 0.15, 1.0, 0.45);          // quiff
    }

    f.head = head; f.body = body; f.root = root;
    return f;
  }

  var FL = makeFigure('bride', +1);   // left
  var FR = makeFigure('groom', -1);   // right
  scene.add(FL.root, FR.root);

  /* =====================================================================
     ENVIRONMENT
     ===================================================================== */
  var env = new THREE.Group(); scene.add(env);
  var pastel = [0xffb3cf, 0xffd9a8, 0xbde8d6, 0xc9c3ff, 0xffe7a3, 0xa9d8ff];

  // island stage
  var stage = new THREE.Mesh(new THREE.CylinderGeometry(19, 20, 0.6, 72), mat(0xcdf1e1, { roughness: 0.8, clearcoat: 0.1 }));
  stage.position.y = -0.31; env.add(stage);
  var rim = new THREE.Mesh(new THREE.TorusGeometry(19, 0.35, 12, 90), mat(0xffd4e4)); rim.rotation.x = Math.PI / 2; rim.position.y = -0.02; env.add(rim);

  // aisle carpet
  var carpetEdge = new THREE.Mesh(new THREE.PlaneGeometry(3.3, 30), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9 }));
  carpetEdge.rotation.x = -Math.PI / 2; carpetEdge.position.set(0, 0.012, -2); env.add(carpetEdge);
  var carpet = new THREE.Mesh(new THREE.PlaneGeometry(2.85, 30), new THREE.MeshStandardMaterial({ color: 0xffbcd3, roughness: 0.85 }));
  carpet.rotation.x = -Math.PI / 2; carpet.position.set(0, 0.02, -2); env.add(carpet);

  // rainbow
  var rainbow = new THREE.Group(); rainbow.position.set(0, -1, -17);
  [0xffadc4, 0xffd3a0, 0xfff1a0, 0xbdeccf, 0xaed6ff, 0xcdb9ff].forEach(function (c, i) {
    var t = new THREE.Mesh(new THREE.TorusGeometry(11 - i * 0.55, 0.3, 12, 80, Math.PI), new THREE.MeshBasicMaterial({ color: c }));
    rainbow.add(t);
  });
  env.add(rainbow);

  // hills
  [[-11, -2.6, -11, 8, 4.2, 4, 0xb9e8d3], [10, -2.9, -12, 9, 4.8, 4, 0xffd5e4], [0, -3.4, -15, 13, 4.6, 4, 0xcdeee0]].forEach(function (h) {
    ell(env, mat(h[6], { roughness: 0.9, clearcoat: 0 }), h[3], h[4], h[5], h[0], h[1], h[2]);
  });

  // lollipop trees
  [[-9, -5], [-12.5, -9], [8.5, -6], [12, -10], [-5.5, -9], [5.5, -9.5]].forEach(function (p, i) {
    var g = new THREE.Group(); g.position.set(p[0], 0, p[1]);
    var st = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 2.4, 10), mat(0xffffff)); st.position.y = 1.2; g.add(st);
    ell(g, mat(pastel[i % pastel.length]), 1.05, 1.05, 1.05, 0, 3.1, 0);
    var sw = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.08, 8, 30), mat(0xffffff)); sw.position.set(0, 3.1, 0.88); g.add(sw);
    env.add(g);
  });

  // ground flowers (instanced)
  (function () {
    var n = 46, petals = new THREE.InstancedMesh(UNIT, new THREE.MeshStandardMaterial({ roughness: 0.5 }), n * 5);
    var centers = new THREE.InstancedMesh(UNIT, new THREE.MeshStandardMaterial({ color: 0xffd36b, roughness: 0.4 }), n);
    var d = new THREE.Object3D(), col = new THREE.Color(), k = 0;
    for (var i = 0; i < n; i++) {
      var x, z; do { x = (Math.random() - 0.5) * 34; z = -10 + Math.random() * 18; } while (Math.abs(x) < 2.3 || Math.hypot(x, z) > 17.5);
      var c = pastel[i % pastel.length];
      for (var j = 0; j < 5; j++) {
        var a = j / 5 * Math.PI * 2;
        d.position.set(x + Math.cos(a) * 0.17, 0.1, z + Math.sin(a) * 0.17); d.scale.set(0.11, 0.07, 0.11); d.rotation.set(0, 0, 0); d.updateMatrix();
        petals.setMatrixAt(k, d.matrix); petals.setColorAt(k, col.setHex(c)); k++;
      }
      d.position.set(x, 0.12, z); d.scale.setScalar(0.09); d.updateMatrix(); centers.setMatrixAt(i, d.matrix);
    }
    env.add(petals, centers);
  })();

  // clouds
  var clouds = [];
  for (var ci = 0; ci < 9; ci++) {
    var cg = new THREE.Group();
    var cm = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, emissive: 0xffeef6, emissiveIntensity: 0.4 });
    [[0, 0, 0, 1.4], [1.3, -0.2, 0.2, 1.1], [-1.3, -0.2, 0, 1.0], [0.5, 0.5, 0, 1.0]].forEach(function (p) { ell(cg, cm, p[3], p[3] * 0.8, p[3], p[0], p[1], p[2]); });
    cg.position.set(-24 + ci * 6 + Math.random() * 3, 5 + Math.random() * 5, -9 - Math.random() * 8);
    cg.userData.speed = 0.15 + Math.random() * 0.25;
    cg.scale.setScalar(0.8 + Math.random() * 0.8);
    env.add(cg); clouds.push(cg);
  }

  // floral wedding arch
  var arch = new THREE.Group(); arch.position.set(0, 0, -2.6); env.add(arch);
  (function () {
    var wood = mat(0xffffff, { roughness: 0.6 }), R3 = 3.2, H = 2.4;
    [-1, 1].forEach(function (s) {
      var c = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.17, H, 14), wood); c.position.set(s * R3, H / 2, 0); arch.add(c);
    });
    var t = new THREE.Mesh(new THREE.TorusGeometry(R3, 0.15, 12, 60, Math.PI), wood); t.position.y = H; arch.add(t);
    var leafM = mat(0x9ddfb4);
    for (var i = 0; i <= 22; i++) {
      var a = i / 22 * Math.PI;
      var x = Math.cos(a) * R3 + (Math.random() - 0.5) * 0.3, y = H + Math.sin(a) * R3 + (Math.random() - 0.5) * 0.3;
      ell(arch, leafM, 0.26, 0.15, 0.2, x, y, 0.1);
      ell(arch, mat(pastel[i % pastel.length]), 0.21, 0.21, 0.21, x + 0.05, y + 0.1, 0.22);
    }
    [-1, 1].forEach(function (s) {
      for (var j = 0; j < 6; j++) {
        ell(arch, mat(pastel[(j + 2) % pastel.length]), 0.2, 0.2, 0.2, s * R3 + (Math.random() - 0.5) * 0.2, 0.3 + j * 0.42, 0.15);
      }
    });
  })();

  // sparkles
  var sparkTex = (function () {
    var c = document.createElement('canvas'); c.width = c.height = 64;
    var x = c.getContext('2d'); var g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.3, 'rgba(255,230,245,.7)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
  })();
  var sparkGeo = new THREE.BufferGeometry(), sp = [];
  for (var si = 0; si < 140; si++) sp.push((Math.random() - 0.5) * 40, Math.random() * 12, -6 + Math.random() * 14);
  sparkGeo.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
  var sparkles = new THREE.Points(sparkGeo, new THREE.PointsMaterial({ map: sparkTex, size: 0.42, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xfff0f8 }));
  scene.add(sparkles);

  /* =====================================================================
     HEARTS + CONFETTI
     ===================================================================== */
  var hs = new THREE.Shape();
  hs.moveTo(25, 25); hs.bezierCurveTo(25, 25, 20, 0, 0, 0); hs.bezierCurveTo(-30, 0, -30, 35, -30, 35);
  hs.bezierCurveTo(-30, 55, -10, 77, 25, 95); hs.bezierCurveTo(60, 77, 80, 55, 80, 35);
  hs.bezierCurveTo(80, 35, 80, 0, 50, 0); hs.bezierCurveTo(35, 0, 25, 25, 25, 25);
  var heartGeo = new THREE.ExtrudeGeometry(hs, { depth: 10, bevelEnabled: true, bevelThickness: 6, bevelSize: 5, bevelSegments: 4, curveSegments: 16 });
  heartGeo.center(); heartGeo.rotateZ(Math.PI); heartGeo.scale(0.012, 0.012, 0.012);

  var bigHeart = new THREE.Mesh(heartGeo, new THREE.MeshPhysicalMaterial({ color: 0xff5c8a, emissive: 0xff3d78, emissiveIntensity: 0.35, roughness: 0.25, clearcoat: 1 }));
  bigHeart.scale.setScalar(0.0001); scene.add(bigHeart);

  var heartCols = [0xff6f9f, 0xff9ec0, 0xffb3d0, 0xff8a8a, 0xd98cff];
  var hearts = [];
  for (var hi = 0; hi < 28; hi++) {
    var hm = new THREE.Mesh(heartGeo, new THREE.MeshPhysicalMaterial({ color: heartCols[hi % heartCols.length], emissive: heartCols[hi % heartCols.length], emissiveIntensity: 0.18, roughness: 0.3, clearcoat: 1 }));
    hm.userData = { bx: (Math.random() * 2 - 1), z: -3 + Math.random() * 7, spd: 0.5 + Math.random() * 0.8, off: Math.random() * 12, size: 0.28 + Math.random() * 0.4, ph: Math.random() * 6 };
    hm.scale.setScalar(0.0001); scene.add(hm); hearts.push(hm);
  }

  var CONF = 260;
  var confetti = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.17, 0.3), new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }), CONF);
  var confData = [], cc = new THREE.Color(), confPal = [0xff6f9f, 0xffd36b, 0x9fe3c6, 0xa9b8ff, 0xffffff, 0xff9ec0, 0xc9a7ff];
  for (var q = 0; q < CONF; q++) {
    confData.push({ x: Math.random() * 2 - 1, z: -4 + Math.random() * 9, spd: 1.2 + Math.random() * 2, off: Math.random() * 14, sw: 0.5 + Math.random() * 1.5, rx: Math.random() * 4, ry: Math.random() * 4, rz: Math.random() * 4 });
    confetti.setColorAt(q, cc.setHex(confPal[q % confPal.length]));
  }
  confetti.frustumCulled = false; confetti.visible = false; scene.add(confetti);
  var dummy = new THREE.Object3D();

  /* =====================================================================
     SKY PALETTE (lerped per scroll segment)
     ===================================================================== */
  var PAL = [['#cfe6ff', '#ffe6f1'], ['#ffe3ec', '#fff3d6'], ['#e4dcff', '#ffe0ee'], ['#d4f3e8', '#fff1d9'], ['#ffd6e5', '#ffeabf'], ['#f3d9ff', '#ffe8c9']]
    .map(function (p) { return p.map(function (c) { return new THREE.Color(c); }); });
  var skyA = new THREE.Color(), skyB = new THREE.Color(), lastSky = '';
  function updateSky() {
    var f = clamp(S.skyT, 0, 5), i = Math.min(4, Math.floor(f)), k = f - i;
    skyA.copy(PAL[i][0]).lerp(PAL[i + 1][0], k); skyB.copy(PAL[i][1]).lerp(PAL[i + 1][1], k);
    var key = skyA.getHexString() + skyB.getHexString();
    if (key !== lastSky) {
      lastSky = key;
      var st = document.documentElement.style;
      st.setProperty('--sky1', '#' + skyA.getHexString()); st.setProperty('--sky2', '#' + skyB.getHexString());
    }
  }

  /* =====================================================================
     RESIZE
     ===================================================================== */
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    view.portrait = (w / h) < 0.9;
    view.halfW = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 11 * camera.aspect;
    view.s = Math.min(1.1, view.halfW * 0.3);
    view.maxX = Math.max(DMIN * view.s * 1.2, (view.halfW - 1.05 * view.s) * 0.95);
    arch.scale.setScalar(view.s * 0.95);
  }
  window.addEventListener('resize', resize);
  resize();

  /* =====================================================================
     FIGURE POSE (every frame)
     ===================================================================== */
  function pose(f, st, x, t, dt) {
    var s = view.s, c = S.celebrate, sg = f.sign, k = st.kneel;
    var dx = x - f.px; f.px = x;
    var speed = Math.abs(dx) / Math.max(dt, 0.001);
    f.walk += (Math.min(1, speed / (2.5 * s)) - f.walk) * Math.min(1, dt * 8);
    f.phase += Math.abs(dx) / (0.9 * s) * Math.PI;
    var sw = Math.sin(f.phase) * f.walk;
    var bob = Math.abs(Math.sin(f.phase)) * 0.14 * f.walk;
    var bounce = Math.abs(Math.sin(t * 3.4)) * 0.2 * c;

    f.root.position.x = x;
    f.root.rotation.y = st.ry + Math.sin(t * 2.2) * 0.05 * c;
    f.root.scale.setScalar(s * Math.max(0.0001, intro.v));
    f.body.position.y = bob + st.hop + bounce - 0.55 * k;
    f.body.scale.y = 1 + Math.sin(t * 2 + f.off) * 0.012;

    f.legL.rotation.x = sw * 0.65 * (1 - k) + 0.9 * k;
    f.legR.rotation.x = -sw * 0.65 * (1 - k) - 1.05 * k;

    var join = S.join, wave = S.wave;
    var waveAng = 2.5 + Math.sin(t * 8 + f.off) * 0.28;
    var iz = sg * (0.12 + (waveAng - 0.12) * wave);
    iz = iz * (1 - join) + sg * 1.15 * join;
    f.inner.rotation.z = lerp(iz, sg * 0.25, k);
    f.inner.rotation.x = lerp(-sw * 0.7 * (1 - join), -1.5, k);

    if (f.bride) {
      f.outer.rotation.z = sg * 0.3;
      f.outer.rotation.x = -0.95 - 0.45 * c * (0.5 + 0.5 * Math.sin(t * 5));
    } else {
      f.outer.rotation.z = -sg * (0.12 + 0.04 * Math.sin(t * 2 + f.off));
      f.outer.rotation.x = sw * 0.7;
    }
    if (f.ring) { f.ring.visible = k > 0.3; f.ring.scale.setScalar(Math.max(0.001, k)); f.ring.rotation.y = t * 2; }

    f.head.rotation.z = Math.sin(t * 1.3 + f.off) * 0.04 - sg * st.tilt;
    f.head.rotation.x = Math.sin(t * 1.7 + f.off) * 0.03 + bob * 0.3;

    var bt = (t * 0.9 + f.off * 3) % 4, bl = bt < 0.15 ? Math.abs(bt - 0.075) / 0.075 : 1;
    f.eyes.forEach(function (e) { e.scale.y = e.userData.sy * Math.max(0.12, bl); });
    f.mouth.scale.set(1 + 0.35 * c + 0.12 * S.love, 1 + 0.9 * c, 1);
  }

  /* =====================================================================
     MAIN LOOP
     ===================================================================== */
  var clock = new THREE.Clock(), ptx = 0, pty = 0, pxs = 0, pys = 0;
  window.addEventListener('pointermove', function (e) {
    ptx = (e.clientX / window.innerWidth - 0.5) * 2; pty = (e.clientY / window.innerHeight - 0.5) * 2;
  }, { passive: true });

  function frame() {
    requestAnimationFrame(frame);
    var dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    var s = view.s;

    updateSky();

    // camera
    pxs += (ptx - pxs) * 0.05; pys += (pty - pys) * 0.05;
    var port = view.portrait;
    var camTY = (port ? 0.6 : 1.9) - S.camDown * (port ? 0.5 : 1.0);
    var camZ = 11 + S.zoom * (port ? 0.4 : 1);
    camera.position.set(S.camX + pxs * 0.7, camTY + 0.55 - pys * 0.25, camZ);
    camera.lookAt(S.camX * 0.5, camTY, 0);

    // figures
    var D = lerp(DMIN * s, view.maxX, S.gap);
    var mid = S.cx * view.maxX;
    pose(FL, L, mid - D, t, dt);
    pose(FR, R, mid + D, t, dt);

    // "love" heart above the pair
    var lv = S.love;
    bigHeart.visible = lv > 0.01;
    bigHeart.position.set(mid, 5.0 * s + Math.sin(t * 2) * 0.12, 0.5);
    bigHeart.scale.setScalar(Math.max(0.0001, lv * (0.95 + 0.08 * Math.sin(t * 5)) * s));
    bigHeart.rotation.y = Math.sin(t * 1.2) * 0.5;

    // celebration hearts
    var cel = S.celebrate;
    for (var i = 0; i < hearts.length; i++) {
      var h = hearts[i], u = h.userData;
      var y = ((t * u.spd + u.off) % 11) - 0.5;
      h.visible = cel > 0.01;
      h.position.set(u.bx * view.halfW * 0.95 + Math.sin(t * u.spd + u.ph) * 0.5, y, u.z);
      h.rotation.set(0, t * 0.8 + u.ph, Math.sin(t + u.ph) * 0.25);
      h.scale.setScalar(Math.max(0.0001, u.size * cel * (0.9 + 0.1 * Math.sin(t * 4 + u.ph))));
    }

    // confetti
    confetti.visible = cel > 0.01;
    if (confetti.visible) {
      for (var j = 0; j < CONF; j++) {
        var d = confData[j];
        var cy = 11.5 - ((t * d.spd + d.off) % 12.5);
        dummy.position.set(d.x * view.halfW * 1.05 + Math.sin(t * d.sw + d.off) * 0.6, cy, d.z);
        dummy.rotation.set(t * d.rx, t * d.ry, t * d.rz);
        dummy.scale.setScalar(Math.max(0.0001, cel));
        dummy.updateMatrix(); confetti.setMatrixAt(j, dummy.matrix);
      }
      confetti.instanceMatrix.needsUpdate = true;
    }

    // ambient motion
    clouds.forEach(function (c) { c.position.x += dt * c.userData.speed; if (c.position.x > 28) c.position.x = -28; });
    sparkles.rotation.y = t * 0.015; sparkles.material.opacity = 0.75 + 0.25 * Math.sin(t * 2);
    glow.intensity = 0.55 + S.celebrate * 0.5;

    renderer.render(scene, camera);
  }

  /* =====================================================================
     SCROLL TIMELINE  (hero -> 4 story scenes -> details)
     Timeline time k == the moment section k is centred on screen.
     ===================================================================== */
  var TAU = Math.PI * 2;
  var tl = gsap.timeline({
    defaults: { ease: 'power2.inOut', duration: 1 },
    scrollTrigger: { trigger: '#main', start: 'top top', end: 'bottom bottom', scrub: 1.2 }
  });

  tl.to(S, { skyT: 5, ease: 'none', duration: 5 }, 0);

  // 0 -> 1  "Awal Bertemu" (2016): they step closer and notice each other
  tl.to(S, { gap: 0.52, love: 0.5 }, 0)
    .to(S, { wave: 0, duration: 0.7 }, 0.1)
    .to(L, { ry: 1.1 }, 0).to(R, { ry: -1.1 }, 0);

  // 1 -> 2  "Bersama" (2017-2026): face to face, heads tilt, she hops with joy
  tl.to(S, { gap: 0.12, love: 0.9 }, 1)
    .to(L, { ry: 1.3, tilt: 0.1 }, 1).to(R, { ry: -1.3, tilt: 0.1 }, 1)
    .to(L, { hop: 0.8, duration: 0.22, ease: 'power2.out' }, 1.45)
    .to(L, { hop: 0, duration: 0.22, ease: 'power2.in' }, 1.67);

  // 2 -> 3  "Cerita Kami": they stroll across the meadow, she twirls
  tl.to(S, { cx: 0.35, gap: 0.22, love: 0.15, zoom: 1.2 }, 2)
    .to(L, { ry: 0.7 + TAU, tilt: 0 }, 2).to(R, { ry: 0.7, tilt: 0 }, 2);

  // 3 -> 4  "Menikah" (5 Des 2026): back to centre, he kneels with the ring
  tl.to(S, { cx: 0, gap: 0.1, zoom: 0.3 }, 3)
    .to(S, { love: 1, duration: 0.8 }, 3.2)
    .to(L, { ry: 1.35 + TAU }, 3).to(R, { ry: -1.35 }, 3)
    .to(R, { kneel: 1, duration: 0.5 }, 3.45)
    .to(L, { hop: 0.6, duration: 0.15, ease: 'power2.out' }, 3.7)
    .to(L, { hop: 0, duration: 0.15, ease: 'power2.in' }, 3.85)
    .to(L, { hop: 0.6, duration: 0.15, ease: 'power2.out' }, 3.9)
    .to(L, { hop: 0, duration: 0.1, ease: 'power2.in' }, 4.05 - 0.05);

  // 4 -> 5  "Ya!": hand in hand at the centre, hearts + confetti
  tl.to(R, { kneel: 0, duration: 0.4 }, 4)
    .to(S, { gap: 0, duration: 0.8 }, 4)
    .to(S, { join: 1, duration: 0.7 }, 4.3)
    .to(L, { ry: 0.2 + TAU, tilt: 0.12, duration: 0.8 }, 4.2)
    .to(R, { ry: -0.2, tilt: 0.12, duration: 0.8 }, 4.2)
    .to(S, { love: 0, duration: 0.4 }, 4.5)
    .to(S, { celebrate: 1, duration: 0.5, ease: 'power2.out' }, 4.5)
    .to(S, { camDown: 1, zoom: -1, duration: 1 }, 4);

  gsap.to(intro, { v: 1, duration: 1.6, ease: 'back.out(1.8)', delay: 0.2 });

  frame();
  window.addEventListener('load', function () { ScrollTrigger.refresh(); });
})();
</script>
</body>
