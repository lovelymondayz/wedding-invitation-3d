server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json font/woff2 image/svg+xml;
    gzip_min_length 1024;

    # The HTML is the entry point and must always be revalidated so a
    # redeploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Fonts never change once vendored.
    location ~* \.woff2$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vendored JS/CSS can change between deploys.
    location ~* \.(js|css)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
